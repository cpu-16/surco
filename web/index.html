<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Surco</title>
    <meta name="description" content="Compara maneras de sembrar tu parcela según lo que le hacen al suelo, con datos de la NASA y lo que ves en tu terreno." />
    <meta name="theme-color" content="#eef0e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151812" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Surco" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // el tema que escogió la persona se aplica antes de pintar, sin parpadeo
      try { var t = JSON.parse(localStorage.getItem('surco-tema')); if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
